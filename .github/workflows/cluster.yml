name: cluster

on:
  push:
    branches: [main]
    paths: ["engine/**", "cluster/**", "proto/**", ".github/workflows/cluster.yml"]
  pull_request:
    paths: ["engine/**", "cluster/**", "proto/**", ".github/workflows/cluster.yml"]

jobs:
  failover:
    name: failover and recovery (3 real nodes, race detector)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gRPC and protobuf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
      - name: Build epzero-node
        run: |
          cmake -S engine -B build -G Ninja -DEPZERO_BUILD_TESTS=OFF -DEPZERO_BUILD_BENCH=OFF
          cmake --build build --target epzero_node
      - uses: actions/setup-go@v5
        with:
          go-version-file: cluster/go.mod
          cache-dependency-path: cluster/go.sum
      - name: Format and vet
        working-directory: cluster
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w"; exit 1; }
          go vet ./... && go vet -tags integration ./...
          GOOS=js GOARCH=wasm go vet ./router ./sim ./cmd/epzero-sim
      - name: Known vulnerabilities reachable from our code
        working-directory: cluster
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: HTTP API, and linearizability under crashes, partitions and lossy links (simulated, Porcupine)
        working-directory: cluster
        run: go test -race -count=1 ./...
      - name: Kill a node mid-traffic, fail over, recover, lose nothing
        working-directory: cluster
        env:
          EPZERO_NODE_BIN: ${{ github.workspace }}/build/epzero-node
        run: go test -race -tags integration -count=1 -v ./...
