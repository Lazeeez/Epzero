name: pages

on:
  push:
    branches: [main]
    paths: ["engine/**", "cluster/**", "web/**", "bench/results/**", "scripts/build_wasm.sh", "scripts/build_sim_wasm.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
      - run: sudo apt-get install -y ninja-build
      - name: Build WebAssembly engine (threaded + single-threaded)
        run: scripts/build_wasm.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: cluster/go.mod
          cache-dependency-path: cluster/go.sum
      - name: Build the cluster simulator (Go router to WebAssembly)
        run: scripts/build_sim_wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium firefox webkit
      - name: Dependency audit (fails on high-severity advisories)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      # The CLIP text and image encoders (154 MB) are self-hosted with the site; fetch once, reuse.
      - uses: actions/cache@v4
        with:
          path: web/public/models
          key: clip-vit-base-patch32-text-vision-q8-v1
      - name: Build site
        working-directory: web
        run: npm run build
      - name: End-to-end tests (Chromium, Firefox, WebKit, accessibility, offline, GitHub Pages isolation)
        working-directory: web
        run: npx playwright test --reporter=line
      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
