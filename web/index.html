<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only this site's own code runs (no injected scripts or eval; WebAssembly allowed). The one
         inline script, the theme bootstrap, is added to script-src by its hash at build time.
         Photos come from Flickr. A meta tag, so the policy (with the build's script hash) travels with the
         page on any host; frame-ancestors, which a meta tag can't carry, is a header (public/_headers). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.staticflickr.com; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' blob: data: https://*.staticflickr.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Epzero · A vector database, running in your browser</title>
    <meta
      name="description"
      content="Epzero is an HNSW vector database written from scratch in C++20: SIMD kernels, 8-bit quantization, crash-safe storage and replication. This site runs it as WebAssembly to search 29,825 photos in your browser."
    />
    <meta name="theme-color" content="#06070a" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Epzero" />
    <meta property="og:url" content="https://epzero.dev/" />
    <meta property="og:title" content="Epzero · A vector database, running in your browser" />
    <meta property="og:description" content="HNSW from scratch in C++20, compiled to WebAssembly. Search 29,825 photos by text, photo or webcam, and watch every query traverse the graph." />
    <meta property="og:image" content="https://epzero.dev/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="author" content="Lajat" />
    <!-- For search engines: the site, the app it is, and who made it (a data block, not a script). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://epzero.dev/#website",
            "name": "Epzero",
            "url": "https://epzero.dev/",
            "description": "An HNSW vector database built from scratch in C++20, running in the browser as WebAssembly.",
            "inLanguage": "en",
            "author": { "@id": "https://epzero.dev/#author" }
          },
          { "@type": "Person", "@id": "https://epzero.dev/#author", "name": "Lajat" },
          {
            "@type": "WebApplication",
            "@id": "https://epzero.dev/#app",
            "name": "Epzero",
            "url": "https://epzero.dev/",
            "image": "https://epzero.dev/og.jpg",
            "description": "Search 29,825 photos by text, photo or webcam with an HNSW vector database compiled to WebAssembly, and watch each search traverse the graph.",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Any (runs in a web browser)",
            "browserRequirements": "Requires JavaScript and WebAssembly SIMD",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "author": { "@id": "https://epzero.dev/#author" }
          }
        ]
      }
    </script>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="canonical" href="https://epzero.dev/" />
    <!-- Photos all come from one host: open the connection while the app starts. -->
    <link rel="preconnect" href="https://live.staticflickr.com" crossorigin />
    <!-- The text font is needed for the first paint: fetch it alongside the styles, not after them. -->
    <link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Applies the saved theme before first paint (no flash of the wrong theme); inlined at build. -->
    <script src="/src/boot.js"></script>
    <!-- Cross-origin isolation (for WebAssembly threads) and offline caching on a static host.
         Deferred: it runs before the app's module script, which waits for its verdict. -->
    <script defer src="%BASE_URL%sw-register.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Epzero runs a C++ search engine in your browser and needs JavaScript.</noscript>
  </body>
</html>
