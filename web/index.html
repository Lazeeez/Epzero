<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Oryx · A vector database, running in your browser</title>
    <meta
      name="description"
      content="Oryx is an HNSW vector database written from scratch in C++20: SIMD kernels, 8-bit quantization, crash-safe storage and replication. This site runs it as WebAssembly to search 29,825 photos in your browser."
    />
    <meta name="theme-color" content="#06070a" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oryx · A vector database, running in your browser" />
    <meta property="og:description" content="HNSW from scratch in C++20, compiled to WebAssembly. Search 29,825 photos by text, photo or webcam, and watch every query traverse the graph." />
    <meta property="og:image" content="https://lazeeez.github.io/Oryx/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- Applies the saved theme before first paint (no flash of the wrong theme). -->
    <script>
      document.documentElement.classList.add("js");
      try {
        if (localStorage.getItem("oryx-theme") === "light") document.documentElement.dataset.theme = "light";
      } catch {}
    </script>
    <!-- Cross-origin isolation (for WebAssembly threads) and offline caching on a static host. -->
    <script src="%BASE_URL%sw-register.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Oryx runs a C++ search engine in your browser and needs JavaScript.</noscript>
  </body>
</html>
